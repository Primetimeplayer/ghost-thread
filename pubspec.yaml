version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  battery_plus: ^7.1.2
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.1
  flutter_riverpod: ^3.5.0
