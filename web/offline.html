<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6750A4">
  <title>Offline — GhostThread</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">
  <style>
    :root {
      color-scheme: light dark;
      --background: #FEF7FF;
      --surface: #F3EDF7;
      --on-surface: #1D1B20;
      --on-surface-variant: #49454F;
      --primary: #6750A4;
      --on-primary: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #141218;
        --surface: #211F26;
        --on-surface: #E6E0E9;
        --on-surface-variant: #CAC4D0;
        --primary: #D0BCFF;
        --on-primary: #381E72;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--background);
      color: var(--on-surface);
      font-family: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main {
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--on-surface-variant);
    }
    .note {
      background: var(--surface);
      border-radius: 16px;
      padding: 12px 16px;
      font-size: 14px;
    }
    button {
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      padding: 14px 28px;
      font: inherit;
      font-weight: 500;
      color: var(--on-primary);
      background: var(--primary);
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/Icon-192.png" alt="GhostThread">
    <h1>You’re offline</h1>
    <p>GhostThread still works — your thoughts live on this device, not on a server.</p>
    <p class="note">
      This page appears only when the app shell has not finished caching yet.
      Open GhostThread once while online and it will launch offline from then on.
    </p>
    <button type="button" onclick="location.replace('./')">Open GhostThread</button>
  </main>
</body>
</html>
